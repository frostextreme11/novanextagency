      <div class="p-4 rounded-2xl bg-slate-50 space-y-3"><div class="text-xs font-bold text-slate-500 flex items-center gap-1"><i data-lucide="bike" class="w-4 h-4"></i>Kendaraan Utama</div>
        <div class="grid grid-cols-2 gap-3"><div><label class="lbl">Nopol</label><input class="inp font-mono uppercase" name="plate" required value="${esc(m.plate || '')}" placeholder="B 1234 XYZ"></div><div><label class="lbl">Tahun</label><input class="inp" type="number" name="year" value="${m.year || ''}"></div></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="lbl">Merk</label><select class="inp" name="brand">${['Honda', 'Yamaha', 'Suzuki', 'Kawasaki', 'Vespa', 'Lainnya'].map(b => `<option ${m.brand === b ? 'selected' : ''}>${b}</option>`).join('')}</select></div><div><label class="lbl">Tipe</label><input class="inp" name="model" required value="${esc(m.model || '')}" placeholder="Vario 125"></div></div></div>
      <div class="grid grid-cols-2 gap-3 pt-2"><button type="button" class="btn btn-ghost" onclick="App.closeModal()">Batal</button><button class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i>Simpan</button></div></form>`);
  },
  saveCustomer(id, form) {
    const fd = Object.fromEntries(new FormData(form).entries()); const motor = { plate: fd.plate.toUpperCase(), brand: fd.brand, model: fd.model, year: Number(fd.year) || '' };
    if (id) { const c = this.data.customers.find(x => x.id === id); c.name = fd.name; c.phone = fd.phone; c.motors[0] = motor; this.toast('Pelanggan diperbarui', 'success'); }
    else { this.data.customers.push({ id: 'C' + String(++this.data.counters.cust).padStart(3, '0'), name: fd.name, phone: fd.phone, motors: [motor] }); this.toast('Pelanggan baru ditambahkan', 'success'); }
    this.save(); this.closeModal(); this.render();
  },
  deleteCustomer(id) { const c = this.data.customers.find(x => x.id === id); this.confirm('Hapus Pelanggan?', `<b>${esc(c.name)}</b> dan data kendaraannya akan dihapus.`, () => { this.data.customers = this.data.customers.filter(x => x.id !== id); this.save(); this.render(); this.toast('Pelanggan dihapus', 'success'); }); },

  /* =====================================================================
     VIEW: HISTORY
     ===================================================================== */
  view_history() {
    const q = this.ui.trxSearch.toLowerCase();
    const list = this.data.transactions.filter(t => t.id.toLowerCase().includes(q) || t.customerName.toLowerCase().includes(q) || (t.motor || '').toLowerCase().includes(q)).sort((a, b) => b.date.localeCompare(a.date));
    const groups = {}; list.forEach(t => { const k = t.date.slice(0, 10); (groups[k] = groups[k] || []).push(t); });
    return `<div class="flex gap-2 mb-4"><div class="relative flex-1"><i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i><input class="inp !pl-10" placeholder="Cari no. struk, pelanggan, nopol..." value="${esc(this.ui.trxSearch)}" oninput="App.ui.trxSearch=this.value;App.render()"></div><button class="btn btn-ghost" onclick="App.exportCSV()"><i data-lucide="download" class="w-4 h-4"></i><span class="hidden sm:inline">Export CSV</span></button></div>
    <div class="space-y-5">${Object.entries(groups).map(([day, trxs]) => `<div class="animate-fadeUp"><div class="flex items-center justify-between mb-2 px-1"><div class="text-xs font-bold text-slate-500 uppercase">${day === today() ? 'Hari Ini' : fmtDate(day + 'T00:00', false)}</div><div class="text-xs font-bold">${trxs.length} trx • ${rupiah(trxs.reduce((a, t) => a + t.total, 0))}</div></div><div class="card divide-y divide-slate-50 overflow-hidden">${trxs.map(t => `<div class="flex items-center gap-3 p-3.5 hover:bg-slate-50 transition cursor-pointer" onclick="App.receiptModal('${t.id}')"><div class="w-10 h-10 rounded-xl ${t.woId ? 'bg-blue-50 text-blue-600' : 'bg-brand-50 text-brand-600'} grid place-items-center shrink-0"><i data-lucide="${t.woId ? 'wrench' : 'shopping-bag'}" class="w-5 h-5"></i></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="font-bold text-sm font-mono">${t.id}</span><span class="badge bg-slate-100 text-slate-600"><i data-lucide="${this.methodIcon(t.method)}" class="w-3 h-3"></i>${t.method}</span></div><div class="text-xs text-slate-500 truncate">${new Date(t.date).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} • ${esc(t.customerName)} • ${t.items.length} item${t.motor ? ' • ' + esc(t.motor.split(' • ')[0]) : ''}</div></div><div class="text-right"><div class="font-extrabold">${rupiah(t.total)}</div>${t.discount ? `<div class="text-[10px] text-rose-500 font-semibold">disc ${num(t.discount)}</div>` : ''}</div><button class="p-2 rounded-lg hover:bg-slate-200" onclick="event.stopPropagation();App.printReceipt('${t.id}')" title="Cetak ulang"><i data-lucide="printer" class="w-4 h-4"></i></button></div>`).join('')}</div></div>`).join('') || '<div class="text-center text-sm text-slate-400 py-16">Tidak ada transaksi</div>'}</div>`;
  },
  exportCSV() { const rows = [['No', 'Tanggal', 'Pelanggan', 'Motor', 'Item', 'Subtotal', 'Diskon', 'Total', 'Metode', 'Ref WO']]; this.data.transactions.forEach(t => rows.push([t.id, fmtDate(t.date), t.customerName, t.motor || '', t.items.map(i => `${i.name} x${i.qty}`).join('; '), t.subtotal, t.discount, t.total, t.method, t.woId || ''])); const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = `transaksi-${today()}.csv`; a.click(); this.toast('CSV berhasil diunduh', 'success'); },

  /* =====================================================================
     VIEW: REPORTS
     ===================================================================== */
  view_reports() {
    const days = this.salesByDay(7), max = Math.max(...days.map(d => d.total), 1); const all = this.data.transactions;
    const wk = all.filter(t => days.some(d => d.key === t.date.slice(0, 10)));
    const rev = wk.reduce((a, t) => a + t.total, 0);
    const profit = wk.reduce((a, t) => a + t.items.reduce((b, i) => { const p = this.data.products.find(x => x.id === i.id); return b + (i.price - (p ? p.cost : 0)) * i.qty; }, 0) - t.discount, 0);
    const byMethod = {}; wk.forEach(t => byMethod[t.method] = (byMethod[t.method] || 0) + t.total);
    const top = {}; wk.forEach(t => t.items.forEach(i => { top[i.name] = top[i.name] || { qty: 0, total: 0, type: i.type }; top[i.name].qty += i.qty; top[i.name].total += i.price * i.qty; }));
    const topList = Object.entries(top).sort((a, b) => b[1].total - a[1].total).slice(0, 6); const topMax = topList[0]?.[1].total || 1;
    const mech = this.data.mechanics.map(m => ({ ...m, n: this.data.workorders.filter(w => w.mechanicId === m.id).length, done: this.data.workorders.filter(w => w.mechanicId === m.id && (w.status === 'Selesai' || w.status === 'Diambil')).length }));
    const jasa = wk.reduce((a, t) => a + t.items.filter(i => i.type === 'jasa').reduce((b, i) => b + i.price * i.qty, 0), 0);
    return `
    <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 stagger">${[['Omzet 7 Hari', rupiah(rev), 'trending-up', 'bg-brand-500'], ['Laba Kotor', rupiah(profit), 'piggy-bank', 'bg-emerald-500'], ['Pendapatan Jasa', rupiah(jasa), 'wrench', 'bg-blue-500'], ['Rata-rata / Trx', rupiah(wk.length ? rev / wk.length : 0), 'receipt', 'bg-indigo-500']].map(([l, v, ic, c]) => `<div class="card p-5"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-lg ${c} text-white grid place-items-center"><i data-lucide="${ic}" class="w-4 h-4"></i></div><span class="text-xs font-semibold text-slate-500">${l}</span></div><div class="text-xl font-extrabold truncate">${v}</div></div>`).join('')}</div>
    <div class="grid lg:grid-cols-3 gap-4 mt-4">
      <div class="card p-5 lg:col-span-2 animate-fadeUp"><h3 class="font-extrabold mb-5">Grafik Penjualan Harian</h3><div class="flex items-end gap-3 h-52">${days.map((d, i) => `<div class="flex-1 flex flex-col items-center gap-2 h-full justify-end group"><div class="text-[10px] font-bold text-slate-600">${d.total ? num(d.total / 1000) + 'k' : ''}</div><div class="bar w-full rounded-t-xl bg-gradient-to-t ${i === 6 ? 'from-brand-600 to-brand-400' : 'from-slate-800 to-slate-600'} group-hover:from-brand-600 group-hover:to-brand-400" style="height:0" data-h="${Math.max(d.total / max * 100, 3)}"></div><div class="text-[11px] font-semibold text-slate-500">${d.label}</div></div>`).join('')}</div></div>
      <div class="card p-5 animate-fadeUp" style="animation-delay:.1s"><h3 class="font-extrabold mb-4">Metode Pembayaran</h3><div class="space-y-3">${Object.entries(byMethod).sort((a, b) => b[1] - a[1]).map(([m, v]) => `<div><div class="flex justify-between text-sm mb-1"><span class="flex items-center gap-2 font-semibold"><i data-lucide="${this.methodIcon(m)}" class="w-4 h-4 text-slate-400"></i>${m}</span><span class="font-bold">${Math.round(v / rev * 100)}%</span></div><div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="bar h-full rounded-full bg-slate-900" style="width:${v / rev * 100}%"></div></div><div class="text-xs text-slate-400 mt-0.5">${rupiah(v)}</div></div>`).join('')}</div></div>
    </div>
    <div class="grid lg:grid-cols-2 gap-4 mt-4">
      <div class="card p-5 animate-fadeUp" style="animation-delay:.15s"><h3 class="font-extrabold mb-4">Produk & Jasa Terlaris</h3><div class="space-y-3">${topList.map(([n, v], i) => `<div class="flex items-center gap-3"><div class="w-7 h-7 rounded-lg ${i === 0 ? 'bg-brand-500 text-white' : 'bg-slate-100 text-slate-500'} grid place-items-center text-xs font-extrabold">${i + 1}</div><div class="flex-1 min-w-0"><div class="flex justify-between text-sm"><span class="font-semibold truncate pr-2">${esc(n)}</span><span class="font-bold shrink-0">${rupiah(v.total)}</span></div><div class="h-1.5 rounded-full bg-slate-100 mt-1 overflow-hidden"><div class="h-full rounded-full ${v.type === 'jasa' ? 'bg-blue-500' : 'bg-brand-500'}" style="width:${v.total / topMax * 100}%"></div></div><div class="text-[11px] text-slate-400">${v.qty} terjual</div></div></div>`).join('')}</div></div>
      <div class="card p-5 animate-fadeUp" style="animation-delay:.2s"><h3 class="font-extrabold mb-4">Performa Mekanik</h3><div class="space-y-3">${mech.map(m => `<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50"><div class="w-10 h-10 rounded-full bg-blue-600 text-white grid place-items-center font-bold text-sm">${m.name.split(' ').map(x => x[0]).join('').slice(0, 2)}</div><div class="flex-1"><div class="font-bold text-sm">${m.name}</div><div class="text-xs text-slate-500">${m.n} work order • ${m.done} selesai</div></div><div class="text-right"><div class="font-extrabold">${m.n ? Math.round(m.done / m.n * 100) : 0}%</div><div class="text-[10px] text-slate-400">completion</div></div></div>`).join('')}</div></div>
    </div>`;
  },

  /* =====================================================================
     VIEW: SETTINGS
     ===================================================================== */
  view_settings() {
    const s = this.data.settings;
    return `<div class="grid lg:grid-cols-2 gap-4">
      <form class="card p-5 space-y-4 animate-fadeUp" onsubmit="event.preventDefault();App.saveSettings(this)">
        <h3 class="font-extrabold flex items-center gap-2"><i data-lucide="store" class="w-5 h-5 text-brand-500"></i>Profil Bengkel</h3>
        <div><label class="lbl">Nama Bengkel</label><input class="inp" name="name" value="${esc(s.name)}" required></div>
        <div><label class="lbl">Alamat</label><input class="inp" name="address" value="${esc(s.address)}"></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="lbl">Telepon</label><input class="inp" name="phone" value="${esc(s.phone)}"></div><div><label class="lbl">Nama Kasir</label><input class="inp" name="kasir" value="${esc(s.kasir)}"></div></div>
        <div><label class="lbl">Footer Struk</label><textarea class="inp" name="footer" rows="2">${esc(s.footer)}</textarea></div>
        <h3 class="font-extrabold flex items-center gap-2 pt-2"><i data-lucide="printer" class="w-5 h-5 text-brand-500"></i>Printer Thermal</h3>
        <div><label class="lbl">Lebar Kertas</label><div class="grid grid-cols-2 gap-2">${['58', '80'].map(p => `<label class="flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer ${s.paper === p ? 'border-brand-500 bg-brand-50' : 'border-slate-200'}"><input type="radio" name="paper" value="${p}" ${s.paper === p ? 'checked' : ''} class="accent-orange-500"><div><div class="font-bold text-sm">${p}mm</div><div class="text-xs text-slate-500">${p === '58' ? '32 karakter / baris' : '42 karakter / baris'}</div></div></label>`).join('')}</div></div>
        <div class="flex gap-2 pt-2"><button class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i>Simpan Pengaturan</button><button type="button" class="btn btn-ghost" onclick="App.testPrint()"><i data-lucide="printer" class="w-4 h-4"></i>Test Print</button></div>
      </form>
      <div class="space-y-4">
        <div class="card p-5 animate-fadeUp" style="animation-delay:.1s"><h3 class="font-extrabold flex items-center gap-2 mb-3"><i data-lucide="users" class="w-5 h-5 text-brand-500"></i>Daftar Mekanik</h3><div class="space-y-2">${this.data.mechanics.map(m => `<div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50"><div class="w-8 h-8 rounded-full bg-blue-600 text-white grid place-items-center text-xs font-bold">${m.name.split(' ').map(x => x[0]).join('').slice(0, 2)}</div><span class="text-sm font-semibold flex-1">${esc(m.name)}</span><button class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50" onclick="App.removeMech('${m.id}')"><i data-lucide="x" class="w-4 h-4"></i></button></div>`).join('')}</div><div class="flex gap-2 mt-3"><input id="mech-name" class="inp" placeholder="Nama mekanik baru"><button class="btn btn-dark" onclick="App.addMech()"><i data-lucide="plus" class="w-4 h-4"></i></button></div></div>
        <div class="card p-5 animate-fadeUp" style="animation-delay:.15s"><h3 class="font-extrabold flex items-center gap-2 mb-3"><i data-lucide="database" class="w-5 h-5 text-brand-500"></i>Data & Penyimpanan</h3><p class="text-sm text-slate-500 mb-3">Semua data tersimpan di <b>localStorage</b> browser ini (${(JSON.stringify(this.data).length / 1024).toFixed(1)} KB). Data tetap ada saat halaman di-reload.</p><div class="flex flex-wrap gap-2"><button class="btn btn-ghost" onclick="App.exportJSON()"><i data-lucide="download" class="w-4 h-4"></i>Backup JSON</button><button class="btn btn-danger" onclick="App.resetData()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>Reset Data Demo</button></div></div>
        <div class="p-5 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-700 text-white animate-fadeUp" style="animation-delay:.2s"><div class="flex items-center gap-2 text-sm font-bold"><i data-lucide="sparkles" class="w-5 h-5"></i>Demo Prototype by NovaNext</div><p class="text-xs text-white/80 mt-2">Prototipe POS Bengkel & Service Motor — single file HTML, Tailwind CSS, Lucide Icons, Vanilla JS. Siap dikembangkan menjadi aplikasi produksi dengan backend & printer Bluetooth.</p></div>
      </div></div>`;
  },
  saveSettings(form) { const fd = Object.fromEntries(new FormData(form).entries()); Object.assign(this.data.settings, fd); this.save(); document.getElementById('side-kasir').textContent = fd.kasir; this.render(); this.toast('Pengaturan tersimpan', 'success'); },
  testPrint() { const t = { id: 'TEST-PRINT', date: new Date().toISOString(), kasir: this.data.settings.kasir, customerName: 'Tes Printer', motor: '', items: [{ name: 'Item Contoh', price: 10000, qty: 1 }], subtotal: 10000, discount: 0, total: 10000, method: 'Tunai', paid: 10000, change: 0 }; const pa = document.getElementById('print-area'); document.documentElement.style.setProperty('--paper', this.data.settings.paper + 'mm'); pa.innerHTML = this.receiptHTML(t); this.toast('Test print dikirim', 'info'); setTimeout(() => window.print(), 300); },
  addMech() { const el = document.getElementById('mech-name'); const n = el.value.trim(); if (!n) return this.toast('Nama mekanik kosong', 'warn'); this.data.mechanics.push({ id: uid('M'), name: n }); this.save(); this.render(); this.toast('Mekanik ditambahkan', 'success'); },
  removeMech(id) { if (this.data.mechanics.length <= 1) return this.toast('Minimal 1 mekanik', 'warn'); this.data.mechanics = this.data.mechanics.filter(m => m.id !== id); this.save(); this.render(); this.toast('Mekanik dihapus', 'info'); },
  exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' })); a.download = `novamotor-backup-${today()}.json`; a.click(); this.toast('Backup diunduh', 'success'); },
};

window.App = App;
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
